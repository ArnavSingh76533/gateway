[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-ai-gateway"
version = "1.0.0"
description = "An async, bring-your-own-key AI gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<0.29",
  "httpcore>=1.0.9,<1.1", "sqlalchemy[asyncio]>=2.0.36,<2.1", "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1", "alembic>=1.14,<2", "redis>=5.2,<7",
  "cryptography>=44,<47", "argon2-cffi>=23.1,<26", "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3", "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
