# Set app to your unique Fly application name before deploying.
app = "replace-with-your-gateway-name"
primary_region = "sin"
[build]
  dockerfile = "Dockerfile"
[env]
  PORT = "7860"
  ENVIRONMENT = "production"
  COOKIE_SECURE = "true"
[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "120s"
  method = "GET"
  path = "/health/ready"
